<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sebastian Davila | Volkswagen Specialist</title>

  <!-- ===== FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- ===== ICONS ===== -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    /* = PAGE VARIABLES = */
    :root {
      --bg-image: url("/sebastian/assets/SDGTISnowBlur.png");

      --silver: #C6C6C6;
      --med-silver: #D5D5D5;
      --bright-silver: #D8D8D8;
      --light-silver: #CECECE;
      --gray-silver: #B0B0B0;
      --gray: #999999;
      --gray-med: #A0A0A0;
      --manila: #E7DCB6;
      --white: #F5F5F5;
      --bright-blue: #64A0F2;

      /* CUSTOM ECHO PALETTE */
      --echo-deep-blue: #24385F;
      --echo-light-blue: #6996C7;
      --echo-soft-white: #F7F5F2;
      --echo-cool-gray: #A4A8AE;

      /* PAGE MATERIALS */
      --page-overlay: rgba(0,0,0,.05);
      --card-bg: rgba(31,47,87,.85);

      /* ACTION MATERIALS */
      --icon-bg: #5A5A5A;
      --icon-hover-bg: #D8E8FF;
      --phone-color: #25D366;
      --facebook-color: #1877F2;
    }

    /* = PAGE = */
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      color: white;
      background:
        var(--bg-image)
        center / cover
        no-repeat
        fixed;
    }

    /* = BACKGROUND OVERLAY = */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--page-overlay);
      pointer-events: none;
    }

    /* = PAGE CONTAINER = */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding-bottom: 8px;
    }

    /* = CARD = */
    .card {
      width: 86%;
      max-width: 700px;
      box-sizing: border-box;
      padding: 28px 40px 38px;
      background: var(--card-bg);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 25px black;
    }

    /* = IDENTITY = */
    .name {
      margin: 0;
      font-family: "Great Vibes", cursive;
      font-size: 52px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      color: var(--echo-soft-white);
      text-shadow:
        2px 2px 8px rgba(0,0,0,.6);
    }

    /* = CONTACT / SOCIAL ACTIONS = */
    .icon-row {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 12px;
      margin-top: 30px;
    }

    .icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 10px;
      border-radius: 10px;
      background: var(--icon-bg);
      color: #000000);
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      transition: .3s;
    }

    .icon i {
      font-size: 24px;
      line-height: 1;
    }

    /* = ACTION COLORS = */
    .phone i {
      color: var(--phone-color);
    }

    .message i {
      color: var(--bright-blue);
    }

    .email i {
      color: var(--manila);
    }

    .facebook i {
      color: var(--facebook-color);
    }

    /* = ACTION HOVER = */
    .icon:hover {
      background: var(--icon-hover-bg);
      transform: scale(1.05);
      opacity: .9;
    }

    /* = LOCATION = */
    .map-section {
      margin-top: 40px;
      text-align: center;
    }

    .map-section h3 {
      margin-top: 10px;
      margin-bottom: 10px;
      font-size: 24px;
      font-weight: 600;
    }

    .map-section p {
      margin-bottom: 15px;
      font-size: 16px;
      opacity: .9;
    }

    .map-section iframe {
      width: 100%;
      height: 250px;
      border: 0;
      border-radius: 15px;
    }

    /* = BRAND SIGNATURE = */
    .brand-footer {
      margin-top: 57px;
      display: flex;
      justify-content: center;
    }

    .brand-footer a {
      display: inline-flex;
    }

    .brand-signature {
      width: 35px;
      height: 35px;
      display: block;
    }

  </style>
</head>

<body>

  <!-- = BACKGROUND OVERLAY = -->
  <div class="overlay"></div>

  <!-- = PAGE CONTENT = -->
  <main class="container">

    <div class="card">

      <!-- = IDENTITY = -->
      <h1 class="name">Sebastian Davila</h1>

      <!-- = CONTACT / SOCIAL ACTIONS = -->
      <div class="icon-row">

        <a
          class="icon phone"
          href="tel:+12544502783"
          aria-label="Call Sebastian">

          <i
            class="fa-solid fa-phone"
            aria-hidden="true">
          </i>

        </a>

        <a
          class="icon message"
          href="sms:+12544502783"
          aria-label="Text Sebastian">

          <i
            class="fa-solid fa-comment-sms"
            aria-hidden="true">
          </i>

        </a>

        <a
          class="icon email"
          href="mailto:sdavila@killeenauto.com"
          aria-label="Email Sebastian">

          <i
            class="fa-solid fa-envelope"
            aria-hidden="true">
          </i>

        </a>

        <a
          class="icon facebook"
          href="https://www.facebook.com/share/1DVJFEeLbL/?mibextid=wwXIfr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Sebastian on Facebook">

          <i
            class="fa-brands fa-facebook-f"
            aria-hidden="true">
          </i>

        </a>

      </div>

      <!-- = LOCATION = -->
      <section class="map-section">

        <h3>Come See Me</h3>

        <p>
          3221 E Central Texas Expressway, Killeen, TX 76543
        </p>

        <iframe
          src="https://www.google.com/maps?q=3221%20E%20Central%20Texas%20Expressway%20Killeen%20TX%2076543&output=embed"
          allowfullscreen
          loading="lazy"
          title="Volkswagen dealership location">
        </iframe>

      </section>

      <!-- = BRAND SIGNATURE = -->
      <div class="brand-footer">

        <a
          href="https://www.vw.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the official Volkswagen website">

          <img
            class="brand-signature"
            src="/assets/VW-logo-white.svg"
            alt="Volkswagen">

        </a>

      </div>

    </div>

  </main>

</body>
</html>
