<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sebastian Davila | Volkswagen Specialist</title>

  <!-- ===== FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- ===== ICONS ===== -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    /* = PAGE VARIABLES = */
    :root {
      --bg-image: url("/sebastian/assets/SDGTISnowBlur.png");

      --silver: #C6C6C6;
      --med-silver: #D5D5D5;
      --bright-silver: #D8D8D8;
      --light-silver: #CECECE;
      --gray-silver: #B0B0B0;
      --gray: #999999;
      --gray-med: #A0A0A0;
      --manila: #E7DCB6;
      --white: #F5F5F5;
      --pure-white: #FFFFFF;
      --bright-blue: #64A0F2;

      /* CUSTOM ECHO PALETTE */
      --echo-deep-blue: #24385F;
      --echo-light-blue: #6996C7;
      --echo-soft-white: #F7F5F2;
      --echo-cool-gray: #A4A8AE;

      /* PAGE MATERIALS */
      --page-overlay: rgba(0,0,0,.05);
      --card-bg: rgba(31,47,87,.80);

      /* ACTION MATERIALS */
      --icon-bg: #5A5A5A;
      --icon-hover-bg: #D8E8FF;
      --phone-color: #25D366;
      --facebook-color: #1877F2;
    }

    class="disclaimer-button"
    id="disclaimerButton"
    type="button"
    aria-label="Page information and disclaimer"
    aria-expanded="false"
    aria-controls="disclaimerPanel">

    <i
    class="fa-solid fa-info"
    aria-hidden="true">
    </i>

    </button>

  <aside
    class="disclaimer-panel"
    id="disclaimerPanel"
    role="dialog"
    aria-labelledby="disclaimerTitle"
    hidden>

  <button
    class="disclaimer-close"
    id="disclaimerClose"
    type="button"
    aria-label="Close disclaimer">
    &times;
  </button>

  <h2 id="disclaimerTitle">
    Independent Salesperson Page
  </h2>

  <p>
    This independently created and maintained personal contact page is for a
    Killeen Volkswagen sales professional and is not an official website of
    Killeen Volkswagen or Volkswagen of America. Volkswagen trademarks and
    logos are the property of their respective owners. The Volkswagen link
    directs to the official Volkswagen website.
  </p>

</aside>

    <script>
  const disclaimerButton = document.getElementById("disclaimerButton");
  const disclaimerPanel = document.getElementById("disclaimerPanel");
  const disclaimerClose = document.getElementById("disclaimerClose");

  function openDisclaimer() {
    disclaimerPanel.hidden = false;
    disclaimerButton.setAttribute("aria-expanded", "true");
    disclaimerClose.focus();
  }

  function closeDisclaimer(returnFocus = true) {
    disclaimerPanel.hidden = true;
    disclaimerButton.setAttribute("aria-expanded", "false");

    if (returnFocus) {
      disclaimerButton.focus();
    }
  }

  disclaimerButton.addEventListener("click", () => {
    if (disclaimerPanel.hidden) {
      openDisclaimer();
    } else {
      closeDisclaimer();
    }
  });

  disclaimerClose.addEventListener("click", () => {
    closeDisclaimer();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !disclaimerPanel.hidden) {
      closeDisclaimer();
    }
  });

  document.addEventListener("click", (event) => {
    if (
      !disclaimerPanel.hidden &&
      !disclaimerPanel.contains(event.target) &&
      !disclaimerButton.contains(event.target)
    ) {
      closeDisclaimer(false);
    }
  });
</script>
      
    /* = PAGE = */
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      color: white;
      background:
        var(--bg-image)
        center / cover
        no-repeat
        fixed;
    }

    /* = BACKGROUND OVERLAY = */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--page-overlay);
      pointer-events: none;
    }

    /* = PAGE CONTAINER = */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding-bottom: 8px;
    }

    /* = CARD = */
    .card {
      width: 86%;
      max-width: 700px;
      box-sizing: border-box;
      padding: 32px 40px 40px;
      background: var(--card-bg);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 25px black;
    }

    /* = IDENTITY = */
    .name {
      margin: 0;
      font-family: "Great Vibes", cursive;
      font-size: 52px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      color: var(--pure-white);
      text-shadow:
        2px 2px 8px rgba(0,0,0,.6);
    }

    /* = CONTACT / SOCIAL ACTIONS = */
    .icon-row {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 32px;
      margin-top: 28px;
    }

    .icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      border-radius: 10px;
      background: var(--icon-bg);
      color: #000000;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      transition: .3s;
    }

    .icon i {
      font-size: 24px;
      line-height: 1;
    }

    /* = ACTION COLORS = */
    .phone i {
      color: var(--phone-color);
    }

    .message i {
      color: var(--bright-blue);
    }

    .email i {
      color: var(--manila);
    }

    .facebook i {
      color: var(--facebook-color);
    }

    /* = ACTION HOVER = */
    .icon:hover {
      background: var(--icon-hover-bg);
      transform: scale(1.05);
      opacity: .9;
    }

    /* = LOCATION = */
    .map-section {
      margin-top: 30px;
      text-align: center;
    }

    .map-section h3 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .address {
      margin: 8px 0 15px;
      font-size: 16px;
      opacity: .9;
    }

    .address span {
      display: block;
    }

    .map-section iframe {
      display: block;
      width: 100%;
      height: 190px;
      border: 0;
      border-radius: 15px;
    }

    /* = BRAND SIGNATURE = */
    .brand-footer {
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }

    .brand-footer a {
      display: inline-flex;
    }

    .brand-signature {
      width: 35px;
      height: 35px;
      display: block;
    }

    /* = PAGE DISCLAIMER = */
.disclaimer-button {
  position: fixed;
  right: 10px;
  bottom: 10px;
  z-index: 10;

  width: 28px;
  height: 28px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.45);
  border-radius: 50%;

  background: rgba(31,47,87,.72);
  color: var(--pure-white);

  box-shadow: 0 2px 8px rgba(0,0,0,.28);

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  cursor: pointer;
}

.disclaimer-button i {
  font-size: 12px;
}

.disclaimer-button:focus-visible {
  outline: 2px solid var(--pure-white);
  outline-offset: 2px;
}

.disclaimer-panel {
  position: fixed;
  right: 10px;
  bottom: 48px;
  z-index: 11;

  width: min(320px, calc(100vw - 20px));
  box-sizing: border-box;

  padding: 16px 38px 16px 16px;

  border: 1px solid rgba(255,255,255,.22);
  border-radius: 14px;

  background: rgba(31,47,87,.96);
  color: var(--pure-white);

  text-align: left;

  box-shadow: 0 8px 24px rgba(0,0,0,.38);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.disclaimer-panel[hidden] {
  display: none;
}

.disclaimer-panel h2 {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
}

.disclaimer-panel p {
  margin: 0;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: rgba(255,255,255,.88);
}

.disclaimer-close {
  position: absolute;
  top: 7px;
  right: 7px;

  width: 26px;
  height: 26px;
  padding: 0;

  border: 0;
  background: transparent;
  color: var(--pure-white);

  font-size: 20px;
  line-height: 1;

  cursor: pointer;
}

.disclaimer-close:focus-visible {
  outline: 2px solid var(--pure-white);
  outline-offset: 1px;
}
    
  </style>
